# Every job pins ubuntu-24.04, not the floating "ubuntu-latest" label.
# scripts/check-bundle-budget.mjs runs a zero-tolerance byte ratchet against
# a baseline committed from this CI's own output - a floating runner image
# is inconsistent with that premise, since GitHub rolls "ubuntu-latest" to
# a new image periodically without warning, and a system-level change (libc,
# bundled zlib, etc.) can shift gzip output by a few bytes on every route at
# once with no code change behind it (Phase B B9 review: three unexplained
# bundle-budget failures traced no further than "the environment" before
# this pin - npm ci against a committed lockfile had already ruled out
# dependency drift, and two clean local rebuilds with nothing else changed
# had already ruled out the build itself being non-deterministic). Pinning
# turns the remaining "probably the runner" into a checkable claim: if an
# unrelated PR still drifts after this, the runner wasn't it either, and
# the search continues.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm run lint -- --max-warnings=0

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm run format:check

  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm run test

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm run build

  bundle-budget:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - run: npm run bundle-budget
      # Contract prose (written for the backend team) must not ship to the
      # browser - see scripts/openapi-strip-loader.cjs.
      - run: npm run check:contract-prose
      - run: npm run check:zod-trim

  contract-drift:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm run contract-drift
